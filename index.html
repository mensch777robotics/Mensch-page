<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensch Robotics</title>
    <link rel="icon" type="image/png" href="/logo-symbol_transparent-cropped.png">
    <meta property="og:image" content="https://www.menschrobotics.com/logo-symbol_transparent-cropped.png">
    <meta property="og:title" content="Mensch Robotics">
    <meta property="og:description" content="Advanced Robotics Solutions">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "primary-hover": "#2563eb",
                        "background-dark": "#050505",
                        "surface-dark": "#0f0f11",
                        "surface-light": "#18181b",
                        "accent-blue": "#60a5fa",
                        "accent-emerald": "#34d399",
                        "accent-teal": "#2dd4bf",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'orb-pulse': 'orbPulse 2s infinite ease-in-out',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        orbPulse: {
                            '0%, 100%': { transform: 'scale(0.8)', opacity: '0.5' },
                            '50%': { transform: 'scale(1.2)', opacity: '1' },
                        }
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
            color: #0f172a;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #ffffff;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .btn-brochure {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 999;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            overflow: hidden;
            border-radius: 10px;
            padding: 10px 16px;
            background: linear-gradient(90deg, #1E5BFF, #8B3DFF, #FF5E7E);
            background-size: 200% 100%;
            box-shadow: 0 8px 22px rgba(30, 91, 255, 0.35);
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
            transition: background-position 0.5s ease, box-shadow 0.2s ease;
            animation: brochure-gradient-idle 2.4s ease-in-out infinite;
        }
        .btn-brochure::after {
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: rgba(255, 255, 255, 0.4);
            content: "";
            transform: skewX(-25deg);
            pointer-events: none;
            animation: brochure-shine-idle 2.4s ease-in-out infinite;
        }
        .btn-brochure:hover,
        .btn-brochure:focus-visible,
        .btn-brochure:active {
            background-position: 100% 0;
            animation: none;
        }
        .btn-brochure:hover::after,
        .btn-brochure:focus-visible::after,
        .btn-brochure:active::after {
            left: 130%;
            transition: left 0.6s ease;
            animation: none;
        }
        @keyframes brochure-gradient-idle {
            0%, 100% {
                background-position: 0% 0;
            }
            50% {
                background-position: 100% 0;
            }
        }
        @keyframes brochure-shine-idle {
            0%, 35% {
                left: -60%;
            }
            65%, 100% {
                left: 130%;
            }
        }
        .btn-brochure:focus-visible {
            outline: 3px solid rgba(30, 91, 255, 0.35);
            outline-offset: 3px;
        }
        @media (max-width: 599px) {
            .btn-brochure {
                right: 8px;
                bottom: 8px;
                padding: 9px 12px;
                gap: 6px;
                font-size: 0.875rem;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .btn-brochure,
            .btn-brochure::after {
                transition: none;
                animation: none;
            }
        }
    </style>
    
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
